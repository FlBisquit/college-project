<!DOCTYPE html>
<html>
<head>
    <title>Комната {{ room_name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chat-log { width: 100%; height: 300px; margin-bottom: 10px; }
        #chat-message-input { width: 80%; padding: 5px; }
        #chat-message-submit { width: 15%; padding: 5px; }
    </style>
</head>
<body>
    <h1>Чат: {{ room_name }}</h1>
    
    <textarea id="chat-log" cols="100" rows="20" readonly></textarea><br>
    <input id="chat-message-input" type="text" size="100" placeholder="Введите сообщение...">
    <input id="chat-message-submit" type="button" value="Отправить">
    
    <script>
        const roomName = "{{ room_name }}";
        const chatSocket = new WebSocket(
            'ws://' + window.location.host + '/ws/chat/' + roomName + '/'
        );

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const log = document.getElementById('chat-log');
            log.value += (data.message + '\n');
        };

        chatSocket.onclose = function(e) {
            console.error('Chat socket closed unexpectedly');
        };

        document.getElementById('chat-message-input').focus();
        document.getElementById('chat-message-input').onkeyup = function(e) {
            if (e.key === 'Enter') {
                document.getElementById('chat-message-submit').click();
            }
        };

        document.getElementById('chat-message-submit').onclick = function() {
            const input = document.getElementById('chat-message-input');
            const message = input.value;
            if (message) {
                chatSocket.send(JSON.stringify({
                    'message': message
                }));
                input.value = '';
            }
        };
    </script>
</body>
</html>
